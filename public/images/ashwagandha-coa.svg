<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Third-party heavy-metal Certificate of Analysis summary showing passing results for lead, arsenic, mercury, and cadmium">
  <defs>
    <radialGradient id="bgc" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#f9f3e9"/>
      <stop offset="100%" stop-color="#efe2cf"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgc)"/>
  <g fill="#4f7a4a" opacity="0.12">
    <path d="M110 980 C70 880 110 790 200 750 C220 850 190 940 110 980 Z"/>
    <path d="M1090 240 C1130 140 1090 50 1000 10 C980 110 1010 200 1090 240 Z"/>
  </g>

  <!-- certificate sheet -->
  <g transform="rotate(-1.6 600 600)">
    <rect x="210" y="120" width="780" height="960" rx="14" fill="#4f342a" opacity="0.10" transform="translate(12 16)"/>
    <rect x="210" y="120" width="780" height="960" rx="14" fill="#ffffff" stroke="#e4d3c1" stroke-width="3"/>
    <rect x="210" y="120" width="780" height="16" rx="8" fill="#314e2f"/>

    <text x="600" y="216" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="30" letter-spacing="8" fill="#314e2f">CERTIFICATE OF ANALYSIS</text>
    <text x="600" y="258" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="22" letter-spacing="2" fill="#a67352">HEAVY METALS PANEL — ICP-MS</text>
    <path d="M300 286h600" stroke="#dd9333" stroke-width="3"/>

    <text x="300" y="340" font-family="Figtree, Arial, sans-serif" font-size="24" fill="#4f342a"><tspan font-weight="bold">Product:</tspan> Ashwagandha KSM-66® Root Extract, 600 mg</text>
    <text x="300" y="380" font-family="Figtree, Arial, sans-serif" font-size="24" fill="#4f342a"><tspan font-weight="bold">Batch:</tspan> KA-2417 · <tspan font-weight="bold">Tested:</tspan> Independent third-party lab</text>

    <!-- table -->
    <g>
      <rect x="300" y="424" width="600" height="64" fill="#f3f6f2"/>
      <text x="324" y="465" font-family="Figtree, Arial, sans-serif" font-size="23" font-weight="bold" fill="#314e2f">Analyte</text>
      <text x="560" y="465" font-family="Figtree, Arial, sans-serif" font-size="23" font-weight="bold" fill="#314e2f">Limit</text>
      <text x="812" y="465" text-anchor="end" font-family="Figtree, Arial, sans-serif" font-size="23" font-weight="bold" fill="#314e2f">Result</text>

      <g font-family="Figtree, Arial, sans-serif" font-size="23" fill="#4f342a">
        <text x="324" y="540">Lead (Pb)</text>
        <text x="560" y="540">&lt; 0.5 ppm</text>
        <text x="812" y="540" text-anchor="end">&lt; 0.05 ppm</text>
        <text x="324" y="616">Arsenic (As)</text>
        <text x="560" y="616">&lt; 1.0 ppm</text>
        <text x="812" y="616" text-anchor="end">&lt; 0.10 ppm</text>
        <text x="324" y="692">Mercury (Hg)</text>
        <text x="560" y="692">&lt; 0.1 ppm</text>
        <text x="812" y="692" text-anchor="end">&lt; 0.01 ppm</text>
        <text x="324" y="768">Cadmium (Cd)</text>
        <text x="560" y="768">&lt; 0.5 ppm</text>
        <text x="812" y="768" text-anchor="end">&lt; 0.03 ppm</text>
      </g>

      <!-- pass chips -->
      <g font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">
        <g transform="translate(852 518)">
          <rect x="-24" y="0" width="76" height="34" rx="17" fill="#4f7a4a"/>
          <text x="14" y="24" text-anchor="middle">PASS</text>
        </g>
        <g transform="translate(852 594)">
          <rect x="-24" y="0" width="76" height="34" rx="17" fill="#4f7a4a"/>
          <text x="14" y="24" text-anchor="middle">PASS</text>
        </g>
        <g transform="translate(852 670)">
          <rect x="-24" y="0" width="76" height="34" rx="17" fill="#4f7a4a"/>
          <text x="14" y="24" text-anchor="middle">PASS</text>
        </g>
        <g transform="translate(852 746)">
          <rect x="-24" y="0" width="76" height="34" rx="17" fill="#4f7a4a"/>
          <text x="14" y="24" text-anchor="middle">PASS</text>
        </g>
      </g>

      <g stroke="#e4d3c1" stroke-width="2">
        <path d="M300 488h600"/>
        <path d="M300 564h600"/>
        <path d="M300 640h600"/>
        <path d="M300 716h600"/>
        <path d="M300 792h600"/>
      </g>
    </g>

    <text x="300" y="852" font-family="Figtree, Arial, sans-serif" font-size="23" fill="#4f342a">Withanolides ≥ 5% — verified by HPLC</text>
    <text x="300" y="890" font-family="Figtree, Arial, sans-serif" font-size="20" fill="#a67352">Illustrative summary for the prototype.</text>

    <!-- signature -->
    <path d="M300 986 C340 950 372 992 410 962 C440 940 470 972 500 956" stroke="#4f342a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M300 1006h240" stroke="#e4d3c1" stroke-width="3"/>
    <text x="300" y="1038" font-family="Figtree, Arial, sans-serif" font-size="19" fill="#a67352">Laboratory Director</text>

    <!-- seal -->
    <g transform="translate(846 964)">
      <circle r="78" fill="#314e2f"/>
      <circle r="78" fill="none" stroke="#4f7a4a" stroke-width="5"/>
      <circle r="58" fill="none" stroke="#9cba97" stroke-width="3" stroke-dasharray="6 6"/>
      <path d="M-24 2l16 16 34-38" stroke="#f3f6f2" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-34 66 L-14 110 L2 84 L18 110 L38 66" fill="#dd9333"/>
    </g>
  </g>
</svg>
